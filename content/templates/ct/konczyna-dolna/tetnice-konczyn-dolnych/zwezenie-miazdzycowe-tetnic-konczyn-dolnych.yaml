sections:
  assessmentChecklist:
    - "Lokalizacja, długość i nasilenie zwężeń oraz zwapnienia."
    - "Drożność napływu i odpływu, zwłaszcza tętnic podudzia."
  reportTemplate: |
    Zmiany miażdżycowe {{lokalizacja}}, ze zwężeniem światła {{stopien_procent}}% na długości {{dlugosc_mm}} mm. Napływ {{naplyw}}, tętnice podudzia i stopy {{odplyw}}. Zwapnienia {{zwapnienia}}; ograniczenia oceny {{ograniczenia}}.
  impressionTemplate: |
    Miażdżycowe zwężenie {{tetnica_i_strona}} około {{stopien_procent}}%.
  clinicalNotes:
    - "Słabe wypełnienie dystalnych tętnic może wynikać z czasu akwizycji lub wolnego przepływu; należy podać ograniczenia badania."
