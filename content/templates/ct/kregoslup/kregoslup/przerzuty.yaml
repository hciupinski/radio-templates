sections:
  assessmentChecklist:
    - "Poziom, liczba, wymiary i charakter zmian kostnych oraz zajęcie elementów kręgów."
    - "Destrukcja korowa, patologiczne złamanie, przemieszczenie odłamów i szerokość kanału."
    - "Widoczna masa nadtwardówkowa i przykręgowa oraz ograniczenia oceny rdzenia."
  reportTemplate: |
    W {{poziomy}} widoczne {{liczba}} zmian {{charakter_osteolityczny_osteoblastyczny_lub_mieszany}} o wymiarach do {{wymiar_mm}} mm, obejmujących {{elementy_kregow}}. Destrukcja warstwy korowej {{destrukcja}}. Złamanie patologiczne {{zlamanie}}, retropulsja {{retropulsja}}. Tkanka przykręgowa lub nadtwardówkowa {{tkanka_miekka}}; kanał kręgowy {{kanal}}. Inne zmiany w objętym zakresie {{inne}}.
  impressionTemplate: |
    Zmiany kostne {{poziomy}} podejrzane o przerzuty. {{zlamanie_lub_komponent_nadtwardowkowy}}.
  clinicalNotes:
    - "CT może nie wykazać wczesnych zmian szpikowych; ocena zajęcia nadtwardówkowego i ucisku rdzenia jest ograniczona. MR lepiej ocenia szpik, tkanki miękkie i rdzeń."
