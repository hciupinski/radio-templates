sections:
  assessmentChecklist:
    - Strona, poziom węzłów, liczba i wymiar osi krótkiej największych zmian.
    - Martwica, torbielowatość, zatarcie granic i naciekanie tkanek otaczających.
    - Relacja do naczyń i widoczne podejrzane ognisko pierwotne.
