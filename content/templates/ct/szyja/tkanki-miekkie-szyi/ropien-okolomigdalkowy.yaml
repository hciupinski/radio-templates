  assessmentChecklist:
    - Strona, wymiary i położenie zbiornika względem migdałka.
    - Szerzenie do przestrzeni przygardłowej i zagardłowej oraz stan dróg oddechowych.
    - Żyła szyjna wewnętrzna i współistniejące węzły chłonne.
