sections:
  assessmentChecklist:
    - Miejsce wyjścia, wymiary, przekraczanie linii pośrodkowej i granice anatomiczne zmiany.
    - Naciekanie sąsiednich przestrzeni, chrząstek, kości i relacja do naczyń oraz drożność dróg oddechowych.
    - Węzły chłonne według strony i poziomu, wymiar osi krótkiej i cechy martwicy lub naciekania pozawęzłowego.
  reportTemplate: |
    W {{lokalizacja_i_strona}} widoczna zmiana tkankowa o wymiarach {{wymiary_mm}} mm, wzmacniająca się {{charakter_wzmocnienia}}. Zasięg {{granice_i_struktury_sasiednie}}, stosunek do naczyń {{opis}}, światło dróg oddechowych {{opis}}. Węzły chłonne szyi {{poziomy_strony_wymiary_i_morfologia}}. Widoczne kości i chrząstki {{opis}}.
  impressionTemplate: |
    Guz {{lokalizacja}} o zasięgu {{zasieg}}. {{podejrzane_wezly_lub_brak}}.
  clinicalNotes:
    - Obrazowanie opisuje zasięg zmiany; rozpoznanie histopatologiczne wymaga korelacji klinicznej.
