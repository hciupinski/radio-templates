  assessmentChecklist:
    - Rozległość gazu w tkankach podskórnych i mięśniach.
    - Odma opłucnowa lub śródpiersiowa i potencjalne źródło.
    - Uraz, dreny, uszkodzenie dróg oddechowych lub przełyku w dostępnym zakresie.
  reportTemplate: |
    W tkankach miękkich ściany klatki piersiowej po stronie {{strona}}, w przestrzeniach podskórnych oraz pomiędzy pasmami mięśniowymi obecne pęcherzyki gazu, rozprzestrzeniające się od poziomu {{poziom_gorny}} do {{poziom_dolny}}. Dodatkowo {{odma_oplucnowa}} oraz {{odma_srodpiersia}}. Drogi oddechowe, przełyk i ewentualne dreny {{ocena_i_ograniczenia}}.
