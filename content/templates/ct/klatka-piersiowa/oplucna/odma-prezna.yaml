sections:
  assessmentChecklist:
    - Rozległość odmy, zapadnięcie płuca i przemieszczenie śródpiersia.
    - Położenie przepony i ucisk struktur śródpiersia.
    - Krytyczny wynik przekaż niezwłocznie; rozpoznanie odmy prężnej jest kliniczne.
  reportTemplate: |
    W {{strona}} jamie opłucnej obecna rozległa odma, z {{stopien_zapadniecia}} płuca po tej stronie. Widoczne {{przemieszczenie_srodpiersia}}, {{polozenie_kopuly_przepony}} oraz {{ucisk_struktur_srodpiersia}}. {{plyn_oplucnowy_dren_i_inne_obrazenia}}.
  impressionTemplate: |
    Rozległa {{strona}} odma opłucnowa z {{cechy_efektu_masy}} – {{podejrzenie_odmy_preznej_w_kontekscie_klinicznym}}.
  clinicalNotes:
    - Odma prężna jest rozpoznaniem klinicznym. Podejrzenie należy niezwłocznie przekazać zespołowi leczącemu. Przy niestabilności hemodynamicznej lub ciężkich zaburzeniach oddychania obrazowanie nie powinno opóźniać pilnego postępowania.
