sections:
  assessmentChecklist:
    - Strona, ilość, rozmieszczenie i ewentualna otorebkowana przestrzeń płynowa.
    - Pogrubienie lub guzki opłucnej, gaz w zbiorniku i wzmocnienie opłucnej, jeśli podano kontrast.
    - Niedodma, zmiany płuca i inne możliwe podłoże.
  reportTemplate: >
    Płyn w {{strona}} jamie opłucnej, {{ilosc_i_rozmieszczenie}}, {{cechy_otorebkowania}}. Opłucna
    {{pogrubienie_guzki_wzmocnienie}}, gaz w płynie {{gaz_w_plynie}}. Sąsiedni miąższ płuca {{niedodma_lub_zmiana}}. {{pozostale_istotne_zmiany}}.
  impressionTemplate: |
    {{strona}} płyn opłucnowy {{ilosc_i_charakterystyka}}. {{zmiany_towarzyszace}}.
  clinicalNotes:
    - Cechy płynu i opłucnej w CT mogą sugerować przyczynę, lecz same nie rozstrzygają etiologii. Ocena wzmocnienia opłucnej wymaga odpowiedniej fazy po kontraście.
