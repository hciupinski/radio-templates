sections:
  assessmentChecklist:
    - Jednorodność, densyjność i rozmieszczenie płynu oraz ewentualne przegrody.
    - Pogrubienie i wzmocnienie opłucnej, w tym rozdzielenie jej blaszek, jeśli podano kontrast.
    - Odma, niedodma uciskowa i możliwe źródło płynu.
  reportTemplate: |
    W {{strona}} jamie opłucnej obecny płyn o densyjności około {{gestosc_hu}} HU, tworzący warstwę maksymalnej grubości {{grubosc_mm}} mm. Płyn gromadzi się głównie w {{rozmieszczenie}}. W przylegającym miąższu płucnym {{zmiany_niedodmowe}}. Odma opłucnowa {{odma}}. Opłucna {{pogrubienie_guzki_wzmocnienie_lub_ograniczenia}}, gaz w płynie {{gaz}}.
  impressionTemplate: |
    Płyn w {{strona}} jamie opłucnej, {{niedodma_kompresyjna}}. {{istotne_cechy_towarzyszace}}.
  clinicalNotes:
    - Cechy płynu i opłucnej w CT mogą sugerować przyczynę, lecz same nie rozstrzygają etiologii. Ocena wzmocnienia opłucnej wymaga odpowiedniej fazy po kontraście.
    - Wysoka densyjność może sugerować domieszkę krwi, ale sama jej nie potwierdza. Obraz rozdzielonych blaszek opłucnej może sugerować ropniak w odpowiednim kontekście klinicznym.
