sections:
  assessmentChecklist:
    - Lokalizacja i rozległość gazu opłucnowego, w tym zbiornika lokulowanego.
    - Blaszka opłucnej trzewnej i odróżnienie od dużej bulli rozedmowej.
    - Płuco, płyn opłucnowy i ewentualny efekt masy.
  reportTemplate: |
    W {{lokalizacja}} części {{strona}} jamy opłucnej obecna przestrzeń gazowa bez rysunku naczyniowego, oddzielona od miąższu płuca widoczną blaszką opłucnej trzewnej. Maksymalna odległość pomiędzy blaszkami opłucnej wynosi {{odstep_mm}} mm. Struktury śródpiersia {{polozenie_i_efekt_masy}}. Płuco oraz płyn opłucnowy {{zmiany_towarzyszace}}.
  impressionTemplate: |
    {{niewielka_lub_ograniczona}} odma opłucnowa po stronie {{strona}}. {{efekt_masy}}.
  clinicalNotes:
    - Gaz w odmie ograniczonej może zajmować nietypowe położenie. Duża bulla może naśladować odmę; obie zmiany mogą współistnieć. Brak przemieszczenia śródpiersia nie wyklucza klinicznej odmy prężnej.
