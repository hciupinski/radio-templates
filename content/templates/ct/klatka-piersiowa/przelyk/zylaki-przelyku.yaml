sections:
  assessmentChecklist:
    - Położenie i ciągłość poszerzonych naczyń w ścianie przełyku oraz osobno naczyń okołoprzełykowych.
    - Inne drogi krążenia obocznego i cechy nadciśnienia wrotnego w zakresie badania.
    - Jakość kontrastowania oraz ograniczenia oceny.
  reportTemplate: |
    Na wysokości {{odcinek_przelyku}} widoczne kręte, poszerzone naczynia żylne o średnicy do {{srednica_mm}} mm. Ich położenie względem ściany przełyku {{polozenie_srodscienne_lub_okoloprzelykowe}}, wzmocnienie kontrastowe {{wzmocnienie}}. W okolicy wpustu żołądka {{naczynia_oboczne}}. Cechy nadciśnienia wrotnego w zakresie badania {{cechy_nadcisnienia_wrotnego}}. Ograniczenia oceny {{ograniczenia}}.
  impressionTemplate: |
    {{zylaki_scienne_lub_naczynia_okoloprzelykowe_i_pewnosc}}, {{cechy_nadcisnienia_wrotnego}}.
  clinicalNotes:
    - Naczynia okołoprzełykowe nie są tożsame z żylakami w ścianie przełyku; jeżeli lokalizacja jest niepewna, należy to zaznaczyć. CT może nie uwidocznić małych żylaków i nie zastępuje oceny endoskopowej.
    - CT nie określa wiarygodnie ryzyka krwawienia z żylaków.
