sections:
  assessmentChecklist:
    - Lokalizacja, długość, grubość zmiany, zwężenie i poszerzenie powyżej.
    - Stosunek do tchawicy, oskrzeli, aorty i osierdzia, ewentualna przetoka.
    - Regionalne węzły i zmiany odległe w objętym zakresie.
  reportTemplate: |
    Na poziomie {{odcinek}} przełyku {{morfologia}} pogrubienie ściany do {{grubosc_mm}} mm na długości {{dlugosc_mm}} mm, {{wzmocnienie}}; światło {{swiatlo}}. Przełyk powyżej {{poszerzenie_i_tresc}}. Granica z tchawicą, aortą i osierdziem {{relacje}}, cechy przetoki {{przetoka}}. Węzły {{wezly_i_os_krotka}}, zmiany odległe w dostępnym zakresie {{inne}}.
  impressionTemplate: |
    Obraz {{pewnosc}} nowotworu przełyku {{lokalizacja}}. {{szerzenie_pozaprzelykowe_i_wezly}}.
  clinicalNotes:
    - CT nie ustala rozpoznania histologicznego ani nie rozstrzyga wiarygodnie wszystkich warstw naciekania ściany.
