  assessmentChecklist:
    - Rodzaj rekonstrukcji i położenie zespolenia w dostępnym zakresie.
    - Ciągłość przewodu, zakontrastowanie doustne jeśli podano, gaz i zbiorniki w otoczeniu.
    - Drożność, wzmocnienie ściany, dreny i powikłania opłucnowo-płucne.
