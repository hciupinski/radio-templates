    Stan po usunięciu przełyku; rekonstrukcja {{rodzaj_i_przebieg}}, zespolenie {{polozenie}}. Podano kontrast doustny {{tak_nie_i_jakosc}}; {{wynaczynienie_lub_ocena_ograniczona}}. Ściana rekonstrukcji {{wzmocnienie_i_ciaglosc}}, otoczenie {{gaz_plyn_i_zbiorniki}}. Dreny {{dreny}}, płuca i opłucna {{pluca_i_oplucna}}.
