sections:
  assessmentChecklist:
    - Rodzaj rekonstrukcji i położenie zespolenia w dostępnym zakresie.
    - Ciągłość przewodu, zakontrastowanie doustne jeśli podano, gaz i zbiorniki w otoczeniu.
    - Drożność, wzmocnienie ściany, dreny i powikłania opłucnowo-płucne.
  reportTemplate: |
    Stan po usunięciu przełyku; rekonstrukcja {{rodzaj_i_przebieg}}, zespolenie {{polozenie}}. Kontrast doustny {{podanie_i_dotarcie_do_zespolenia}}; wynaczynienie {{wynaczynienie_lub_ocena_ograniczona}}. Ściana rekonstrukcji {{wzmocnienie_i_ciaglosc}}, otoczenie {{gaz_plyn_i_zbiorniki}}. Dreny {{dreny}}, płuca i opłucna {{pluca_i_oplucna}}.
  impressionTemplate: |
    Stan po ezofagektomii {{rekonstrukcja}}. {{ocena_zespolenia_zbiorniki_i_ograniczenia}}.
  clinicalNotes:
    - Brak wynaczynienia kontrastu doustnego nie wyklucza nieszczelności, szczególnie jeśli nie dotarł on do zespolenia. Gaz okołozespoleniowy we wczesnym okresie pooperacyjnym jest nieswoisty; zbiorniki i ich dynamikę należy ocenić w kontekście czasu od zabiegu.
