sections:
  assessmentChecklist:
    - Rodzaj rekonstrukcji i położenie zespolenia.
    - Zbiorniki, kontrast doustny i jego dotarcie do zespolenia, gaz w otoczeniu.
    - Wzmocnienie ściany, skręt, zwężenie, dreny i ewentualna wznowa.
  reportTemplate: |
    Stan po resekcji przełyku z rekonstrukcją {{rodzaj_i_przebieg_rekonstrukcji}}; zespolenie {{poziom}}. W otoczeniu {{gaz_i_zbiorniki}}. Kontrast doustny {{podanie_i_dotarcie_do_zespolenia}}, wynaczynienie {{wynaczynienie_lub_ograniczenia}}. Ściana i światło rekonstrukcji {{wzmocnienie_droznosc_i_skret}}, możliwa wznowa {{wznowa}}; dreny i zmiany opłucnowo-płucne {{inne}}.
  impressionTemplate: |
    Stan po ezofagektomii i rekonstrukcji {{rodzaj}}. {{ocena_zespolenia_powiklan_i_ograniczenia}}.
  clinicalNotes:
    - Brak wynaczynienia kontrastu doustnego nie wyklucza nieszczelności, szczególnie jeśli nie dotarł on do zespolenia. Gaz okołozespoleniowy we wczesnym okresie pooperacyjnym jest nieswoisty; zbiorniki i ich dynamikę należy ocenić w kontekście czasu od zabiegu.
