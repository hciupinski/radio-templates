sections:
  assessmentChecklist:
    - Miejsce i długość podejrzanego ubytku ściany oraz światło tchawicy i oskrzeli.
    - Gaz w śródpiersiu, opłucnej i tkankach podskórnych, rurki i dreny.
    - Niedodma, obrażenia naczyniowe i pozostałe uszkodzenia.
  reportTemplate: |
    Na poziomie {{poziom}} tchawicy, w ścianie {{sciana}}, {{ciaglosc_i_dlugosc_ubytku}}. Światło {{swiatlo}}, oskrzela główne {{oskrzela}}. Gaz w śródpiersiu {{gaz}}, odma opłucnowa i podskórna {{odma}}; rurka i dreny {{urzadzenia}}. Inne obrażenia {{inne}}.
  impressionTemplate: |
    {{pewnosc}} uszkodzenia ściany {{lokalizacja}}. {{odma_i_obrazenia_towarzyszace}}.
  clinicalNotes:
    - Brak widocznej szczeliny w CT nie wyklucza urazu; ocena endoskopowa zależy od obrazu klinicznego.
