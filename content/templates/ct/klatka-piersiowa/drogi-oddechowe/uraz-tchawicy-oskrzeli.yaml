sections:
  assessmentChecklist:
    - Ciągłość ściany i lokalizacja ewentualnej szczeliny tchawicy lub oskrzela.
    - Odma śródpiersia, opłucnowa i podskórna, ustawienie rurki lub drenu.
    - Niedodma, uszkodzenia naczyń i inne obrażenia.
  reportTemplate: |
    Tchawica i oskrzela główne {{ciaglosc_i_miejsce_podejrzane}}. Gaz w śródpiersiu i tkankach miękkich {{gaz}}, odma lub płyn opłucnowy {{oplocna}}. Płuco {{niedodma_i_stluczenie}}, rurka i dreny {{urzadzenia}}. Inne obrażenia {{inne}}.
  impressionTemplate: |
    {{pewnosc}} uszkodzenia {{lokalizacja_drog_oddechowych}}. {{odma_i_inne_obrazenia}}.
  clinicalNotes:
    - Brak widocznej szczeliny w CT nie wyklucza urazu; ocena endoskopowa zależy od obrazu klinicznego.
