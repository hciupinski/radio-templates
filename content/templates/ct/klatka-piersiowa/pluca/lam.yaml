sections:
  assessmentChecklist:
    - "Liczba, wielkość, ściana i rozmieszczenie torbieli; miąższ pomiędzy nimi."
    - "Odma, płyn opłucnowy i zmiany pozapłucne w objętym zakresie."
  reportTemplate: |
    Obustronnie widoczne liczne, dobrze odgraniczone, przeważnie okrągłe i cienkościenne przestrzenie torbielowate o średnicy {{zakres_srednic_mm}} mm. Rozmieszczenie torbieli {{dystrybucja}}. Miąższ płucny pomiędzy torbielami {{miazsz}}. Odma opłucnowa lub płyn w jamie opłucnowej {{odma_i_plyn}}. Zmiany pozapłucne w objętym zakresie {{zmiany_pozaplucne}}.
  impressionTemplate: |
    Rozlane zmiany torbielowate o morfologii {{zgodnosc_z_lam}}; {{roznicowanie}}.
  clinicalNotes:
    - "Same torbiele HRCT nie stanowią pewnego rozpoznania LAM; należy uwzględnić cechy potwierdzające i kontekst kliniczny, w tym TSC, nerkowe AML, chłonkotok lub VEGF-D. Różnicowanie obejmuje Birt-Hogg-Dubé, PLCH, LIP i rozedmę."
