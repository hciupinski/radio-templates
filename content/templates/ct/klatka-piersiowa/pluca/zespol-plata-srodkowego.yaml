sections:
  assessmentChecklist:
    - Utrata objętości, rozstrzenie i porównanie z badaniami poprzednimi.
    - Drożność oskrzela płatowego, czop śluzowy, guz lub ucisk przez węzły.
    - Rozróżnienie obturacyjnego i nieobturacyjnego podłoża, gdy możliwe.
  reportTemplate: |
    Płat środkowy płuca prawego o {{objetosc}}, z {{zageszczenia_i_przemieszczenie_szczelin}}. W jego obrębie {{rozstrzenie_oskrzeli}}. Oskrzele płata środkowego {{droznosc}}, {{zmiana_guzowata_lub_ograniczenia}}. Wnęka prawa {{wezly_i_ucisk}}. W porównaniu z {{data_badania}} {{dynamika_lub_brak_porownania}}.
  impressionTemplate: |
    {{charakter_i_dynamika_zmian}} płata środkowego prawego, {{zgodnosc_z_zespolem_plata_srodkowego}}.
  clinicalNotes:
    - Zespół jest rozpoznaniem kliniczno-obrazowym; pojedyncze badanie nie dowodzi nawracania ani czasu trwania niedodmy.
