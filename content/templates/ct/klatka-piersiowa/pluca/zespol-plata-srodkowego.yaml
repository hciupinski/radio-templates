sections:
  assessmentChecklist:
    - Utrata objętości i zagęszczenie płata środkowego oraz dynamika.
    - "Oskrzele płata środkowego: drożność, wydzielina, ucisk lub widoczna zmiana."
    - Rozstrzenie, zmiany towarzyszące i węzły wnęki.
  reportTemplate: |
    Płat środkowy {{utrata_objetosci_i_zageszczenie}}, {{rozstrzenie_i_wydzielina}}. Oskrzele płata środkowego {{droznosc_i_mozliwa_przeszkoda}}; wnęka prawa {{wezly_lub_zmiana}}. Pozostałe płuca i opłucna {{pozostale_zmiany}}. W porównaniu z {{data_badania}} {{dynamika}}.
  impressionTemplate: |
    Niedodma płata środkowego {{ocena_i_dynamika}}, {{mozliwa_przyczyna}}.
  clinicalNotes:
    - Zespół jest rozpoznaniem kliniczno-obrazowym; pojedyncze badanie nie dowodzi nawracania ani czasu trwania niedodmy.
