sections:
  assessmentChecklist:
    - Liczba, lokalizacja i wymiary zmian płucnych; porównanie.
    - Węzły klatki piersiowej, opłucna, osierdzie i kości.
    - Pozostałe zmiany w zakresie badania oraz ograniczenia oceny.
  reportTemplate: |
    Choroba podstawowa {{nowotwor_pierwotny_lub_nieznany}}. W płucach {{liczba_i_lokalizacja_guzkow}}, największy {{wymiary_mm}} mm, {{charakter}}. Węzły wnękowe, śródpiersiowe i nadobojczykowe w zakresie badania {{wezly_lokalizacja_i_wymiary}}. Opłucna i osierdzie {{oplucna_i_osierdzie}}, kości {{kosci}}, widoczne nadbrzusze {{nadbrzusze_i_ograniczenia}}. Porównanie z {{data_badania}}: {{dynamika}}.
  impressionTemplate: |
    {{ocena_rozsiewu_i_pewnosc}}. {{najwazniejsze_lokalizacje_i_dynamika}}.
  clinicalNotes:
    - Podejrzane ogniska nie są swoiste dla przerzutów; rozpoznanie należy odnieść do choroby podstawowej i badań porównawczych.
