sections:
  assessmentChecklist:
    - Liczba i rozmieszczenie zmian, pomiar największych i porównanie.
    - Jamy, zwapnienia, otoczka mlecznej szyby oraz rozsiew prosówkowy.
    - Kontekst onkologiczny, opłucna i węzły w zakresie badania.
  reportTemplate: |
    W {{stronnosc}} płucach liczne {{charakter}} guzki o rozmieszczeniu {{rozmieszczenie}}, średnicy od {{najmniejszy_mm}} do {{najwiekszy_mm}} mm. Największy guzek w segmencie {{segment}} płuca {{strona}} o wymiarach {{wymiary_mm}} mm. {{lokalizacja_podoplocnowa_i_inne_cechy}}. W porównaniu z badaniem poprzednim {{porownanie}}. Opłucna, węzły i kości {{zmiany_towarzyszace}}.
  impressionTemplate: |
    Obraz licznych zmian guzkowych w płucach, {{pewnosc_rozsiewu_w_kontekscie_choroby_nowotworowej}}.
  clinicalNotes:
    - Podejrzane ogniska nie są swoiste dla przerzutów; rozpoznanie należy odnieść do choroby podstawowej i badań porównawczych.
