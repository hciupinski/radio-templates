sections:
  assessmentChecklist:
    - Lokalizacja, rozległość i wzorzec zagęszczeń.
    - Drogi oddechowe, ewentualna przeszkoda oskrzela, jama i cechy martwicy oceniane z uwzględnieniem fazy.
    - Płyn opłucnowy i węzły chłonne.
  reportTemplate: >
    W {{lokalizacja}} widoczne {{konsolidacje_i_lub_mleczna_szyba}}, o zasięgu {{zasieg}}; bronchogram powietrzny
    {{bronchogram}}. Oskrzela {{oskrzela}}. Jama lub cechy martwicy {{martwica_jama_i_ograniczenia}}. Opłucna {{plyn_i_oplucna}}; węzły
    chłonne {{wezly}}.
  impressionTemplate: |
    {{pewnosc_zmian_zapalnych}} w płucach: {{lokalizacja_i_zasieg}}. {{powiklania_i_ograniczenia}}.
  clinicalNotes:
    - Konsolidacje i zagęszczenia typu mlecznej szyby są nieswoiste; ich interpretacja wymaga danych klinicznych i porównania z wcześniejszymi badaniami. Ocena martwicy zależy od podania kontrastu i jakości fazy.
