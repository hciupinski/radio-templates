sections:
  assessmentChecklist:
    - Rozmieszczenie konsolidacji i bronchogramu powietrznego oraz zmiany typu drzewa w pączkach.
    - Jamy i obszary słabego wzmocnienia w odpowiedniej fazie po kontraście.
    - Płyn opłucnowy, drożność oskrzeli i możliwa przeszkoda.
  reportTemplate: |
    W segmentach {{segmenty}} płuca {{strona}} obecne obszary zagęszczeń miąższowych o charakterze konsolidacji, {{bronchogram_powietrzny}}. W otoczeniu {{mleczna_szyba_i_zmiany_okolooskrzelowe}}. Płyn w jamie opłucnej {{plyn}}. Oskrzela {{oskrzela}}, jamy lub cechy martwicy {{martwica_i_ograniczenia}}.
  impressionTemplate: |
    Zmiany {{pewnosc_zmian_zapalnych}} w płucu {{strona}}, {{morfologia_i_powiklania}}.
  clinicalNotes:
    - Konsolidacje i zagęszczenia typu mlecznej szyby są nieswoiste; ich interpretacja wymaga danych klinicznych i porównania z wcześniejszymi badaniami. Ocena martwicy zależy od podania kontrastu i jakości fazy.
