sections:
  assessmentChecklist:
    - "Węzły wnękowe i śródpiersiowe, symetria, osie krótkie."
    - "Guzki perilimfatyczne, lokalizacja i dystrybucja; włóknienie i rozstrzenie z pociągania."
  reportTemplate: |
    W śródpiersiu i obu wnękach płucnych widoczne powiększone węzły chłonne, największe do {{os_krotka_mm}} mm w osi krótkiej. Rozmieszczenie i symetria limfadenopatii {{wezly_i_symetria}}. W miąższu obu płuc, głównie w {{partie_pluc}}, widoczne drobne guzki o rozmieszczeniu perilimfatycznym, wzdłuż pęczków oskrzelowo-naczyniowych, szczelin międzypłatowych i podopłucnowo. Cechy włóknienia {{wloknienie}}. {{inne_zmiany}}.
  impressionTemplate: |
    Zmiany węzłowe i miąższowe {{pewnosc}} sarkoidozy w odpowiednim kontekście klinicznym.
  clinicalNotes:
    - "Obraz wymaga korelacji klinicznej i różnicowania m.in. z zakażeniem ziarniniakowym i chłoniakiem; samo CT nie ustala rozpoznania histologicznego."
