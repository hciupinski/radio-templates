sections:
  assessmentChecklist:
    - Rozmieszczenie i rozległość mlecznej szyby, konsolidacji i obrazu crazy paving.
    - Jamy, wysięk opłucnowy i cechy atypowe.
    - Obraz nieswoisty; korelacja z badaniem klinicznym i testami.
  reportTemplate: |
    {{stronnosc_i_rozmieszczenie}} widoczne wieloogniskowe obszary matowej szyby, miejscami z {{konsolidacje}} oraz {{pogrubienie_przegrod_i_crazy_paving}}. Jamy rozpadowe {{jamy}}. Opłucna i pozostałe zmiany {{inne_zmiany}}. Porównanie {{porownanie}}.
  impressionTemplate: |
    {{stronnosc_i_zasieg}} zmiany śródmiąższowo-pęcherzykowe o morfologii {{ocena}}, mogące odpowiadać wirusowemu zapaleniu płuc, w tym COVID-19, w odpowiednim kontekście klinicznym.
  clinicalNotes:
    - Obraz CT jest nieswoisty i nie potwierdza ani nie wyklucza zakażenia SARS-CoV-2; wymaga korelacji klinicznej i laboratoryjnej.
