sections:
  assessmentChecklist:
    - Liczba, lokalizacja i wymiary zmian płucnych; porównanie.
    - Węzły klatki piersiowej, opłucna, osierdzie i kości.
    - Pozostałe zmiany w zakresie badania oraz ograniczenia oceny.
  reportTemplate: |
    W obu płucach {{guzki_i_rozmieszczenie}}, największy o średnicy {{srednica_mm}} mm w segmencie {{segment_i_strona}}. Węzły śródpiersia i wnęk {{wezly}}, pachowe i przymostkowe {{wezly_regionalne}}. W objętym zakresie układu kostnego {{ogniska_kostne_i_lokalizacja}}. Jamy opłucnowe {{plyn_lub_zmiany_oplucnowe}}; śródmiąższ {{limfangioza_lub_inne}}, okolica piersi i ściana klatki {{zmiany_pierwotne_lub_po_leczeniu}}. Porównanie {{porownanie}}.
  impressionTemplate: |
    Zmiany ogniskowe w płucach {{oraz_kosciach_lub_innych_lokalizacjach}}, {{pewnosc_rozsiewu_w_kontekscie_raka_piersi}}.
  clinicalNotes:
    - Podejrzane ogniska nie są swoiste dla przerzutów; rozpoznanie należy odnieść do choroby podstawowej i badań porównawczych.
    - Badanie klatki piersiowej ocenia tylko obszar objęty akwizycją; samo nie wyklucza rozsiewu poza klatką piersiową ani nie stanowi pełnej oceny zaawansowania odległego.
