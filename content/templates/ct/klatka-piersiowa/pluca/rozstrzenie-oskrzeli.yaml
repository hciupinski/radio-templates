sections:
  assessmentChecklist:
    - Typ walcowaty, żylakowaty lub torbielowaty oraz rozmieszczenie i rozległość.
    - Poszerzenie oskrzeli w stosunku do naczyń, brak obwodowego zwężania, pogrubienie ścian i zaleganie wydzieliny.
    - Guzki drzewiaste, niedodma, współistniejące włóknienie i ewentualna ogniskowa przeszkoda oskrzela.
  reportTemplate: |
    W {{platy_i_segmenty}} widoczne rozstrzenie oskrzeli typu {{typ}}, o nasileniu {{nasilenie_i_zasieg}}. Ściany oskrzeli {{grubosc_scian}}, zaleganie wydzieliny {{wydzielina}}. Towarzyszące guzki wewnątrzzrazikowe / obraz drzewa w pączkach {{opis}}, niedodma {{opis_niedodmy}}. Ogniskowa przeszkoda w oskrzelu {{ocena_lub_ograniczenie}}. Pozostały miąższ płuc {{pozostale_zmiany}}. W porównaniu z {{data_badania}} {{dynamika_lub_brak_porownania}}.
  impressionTemplate: |
    Rozstrzenie oskrzeli {{typ_i_rozmieszczenie}}, {{nasilenie}}. {{wydzielina_i_zmiany_towarzyszace}}.
  clinicalNotes:
    - Poszerzenie oskrzeli w obszarze włóknienia może mieć charakter rozstrzeni z pociągania; należy opisać współistniejące zaburzenie architektury.
