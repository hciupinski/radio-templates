sections:
  assessmentChecklist:
    - Dystrybucja i typ rozstrzeni, relacja oskrzela do tętnicy i brak zwężania ku obwodowi.
    - Ściany, śluz, guzki środkowozrazikowe, niedodma i zapalenie.
    - Włóknienie i rozstrzenie z pociągania, ogniskowa przeszkoda oskrzela.
  reportTemplate: |
    W {{lokalizacja}} widoczne poszerzone oskrzela typu {{typ}}, {{stopien_i_zasieg}}. Stosunek średnicy oskrzeli do towarzyszących tętnic {{stosunek}}, zwężanie oskrzeli ku obwodowi {{zwezanie}}. Ściany oskrzeli i zalegająca wydzielina {{sciany_i_sluz}}. Guzki środkowozrazikowe i obraz drzewa w pączkach {{guzki}}, niedodma {{niedodma}}. Włóknienie {{wloknienie}}. Porównanie {{porownanie}}.
  impressionTemplate: |
    Rozstrzenie oskrzeli {{lokalizacja_i_typ}}. {{wydzielina_i_zmiany_towarzyszace}}.
  clinicalNotes:
    - Poszerzenie oskrzeli w obszarze włóknienia może mieć charakter rozstrzeni z pociągania; należy opisać współistniejące zaburzenie architektury.
