sections:
  assessmentChecklist:
    - Położenie, trzy wymiary, struktura i brzegi zmiany.
    - Kontakt z opłucną, oskrzelami, naczyniami i ścianą klatki; cechy naciekania.
    - Węzły, zmiany satelitarne i opłucna; CT nie ustala histologii.
  reportTemplate: |
    W segmencie {{segment}} płuca {{strona}} widoczna lita zmiana guzowata o wymiarach około {{wymiary_mm}} mm, o {{zarysy}} zarysach i {{struktura}} strukturze, wykazująca {{wzmocnienie}} wzmocnienie kontrastowe. Zmiana przylega do {{sasiednie_struktury}}, {{cechy_naciekania}}. Węzły chłonne śródpiersia i wnęk o wymiarach do {{os_krotka_mm}} mm w osi krótkiej, {{stacje_i_strony}}. Drożność oskrzeli {{oskrzela}}, dodatkowe zmiany płucne i opłucnowe {{guzki_i_oplucna}}; inne zmiany w zakresie badania {{inne}}.
  impressionTemplate: |
    Guz płuca {{strona_i_lokalizacja}}, o morfologii podejrzanej o pierwotny proces nowotworowy. {{zasieg_i_zmiany_towarzyszace}}.
  clinicalNotes:
    - Samo CT nie potwierdza typu histologicznego ani nie wyklucza mikroskopowego zajęcia węzłów; ocena odległego rozsiewu dotyczy wyłącznie struktur objętych badaniem.
