sections:
  assessmentChecklist:
    - Osiowe i pionowe rozmieszczenie włóknienia.
    - Siateczka, zaburzenie architektury, rozstrzenie z pociągania i plaster miodu.
    - Cechy alternatywnego rozpoznania i kategoria wzorca HRCT.
  reportTemplate: |
    W {{rozmieszczenie}} widoczne zmiany siateczkowate i {{zaburzenie_architektury}}, rozstrzenie oskrzeli i oskrzelików z pociągania {{rozstrzenie}} oraz ocena podopłucnowych wielowarstwowych przestrzeni torbielowatych {{plaster_miodu}}. Inne cechy, w tym mleczna szyba i cechy sugerujące alternatywne rozpoznanie {{inne_cechy}}. Porównanie {{porownanie}}.
  impressionTemplate: |
    Wzorzec HRCT {{uip_prawdopodobny_uip_nieokreslony_dla_uip_lub_sugerujacy_inne_rozpoznanie}}. {{kontekst_i_dynamika}}.
  clinicalNotes:
    - UIP jest wzorcem obrazowym występującym także w innych chorobach; rozpoznanie IPF wymaga oceny klinicznej i wykluczenia innych przyczyn włóknienia. Wzorzec nieokreślony dla UIP dotyczy włóknienia niespełniającego kryteriów UIP ani prawdopodobnego UIP, bez cech wyraźnie sugerujących inną przyczynę.
