sections:
  assessmentChecklist:
    - Strona, segmenty, rozległość i relacja do miejsca urazu.
    - Złamania ściany, odma, płyn opłucnowy i pourazowe jamy.
    - Kontekst czasowy i możliwa ewolucja stłuczenia.
  reportTemplate: |
    W {{lokalizacja}} widoczne nieregularne obszary matowej szyby i konsolidacji {{zasieg}}, {{stosunek_do_granic_segmentow}}. W sąsiedztwie {{obrazenia_sciany}}. Odma lub płyn opłucnowy {{oplucna}}, pourazowe jamy {{jamy}}.
  impressionTemplate: |
    Pourazowe zmiany miąższu płuca {{lokalizacja_i_zasieg}}, {{pewnosc}} stłuczenia. {{obrazenia_towarzyszace}}.
  clinicalNotes:
    - Stłuczenie może stać się bardziej rozległe w kolejnych godzinach po urazie.
