sections:
  assessmentChecklist:
    - Typ rozedmy i rozmieszczenie osiowe oraz szczytowo-podstawne.
    - Rozległość zmian, obecność pęcherzy rozedmowych i ucisk sąsiedniego miąższu.
    - Inne zmiany miąższowe, włóknienie, drogi oddechowe oraz porównanie z badaniem wcześniejszym.
  reportTemplate: |
    W {{lokalizacja}} obszary obniżonej gęstości odpowiadające rozedmie {{typ_rozedmy}}, o nasileniu {{nasilenie}} i rozmieszczeniu {{rozmieszczenie}}. Pęcherze rozedmowe {{lokalizacja_wymiary_i_ucisk_lub_brak}}. Drogi oddechowe {{opis_oskrzeli}}. Pozostały miąższ płuc {{zmiany_towarzyszace}}. Jamy opłucnej {{oplucna}}. W porównaniu z badaniem {{data_badania}} {{dynamika_lub_brak_porownania}}.
  impressionTemplate: |
    Rozedma płuc {{typ_i_rozmieszczenie}}, {{nasilenie}}. {{pecherze_i_zmiany_towarzyszace}}.
  clinicalNotes:
    - Rozpoznanie POChP wymaga danych klinicznych i czynnościowych; sam obraz rozedmy w CT nie określa stopnia obturacji.
