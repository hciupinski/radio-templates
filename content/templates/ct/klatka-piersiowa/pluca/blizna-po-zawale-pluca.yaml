  reportTemplate: |
    W obwodowej, podopłucnowej części płata {{plat_i_strona}} widoczne pasmowate zagęszczenie miąższowe z {{zaciaganie_oplucnej}} i {{zmniejszenie_objetosci}} sąsiedniego miąższu. Zmiana o charakterze włóknistym, {{komponenta_guzkowa}}. Porównanie {{porownanie}}.
  impressionTemplate: |
    Podopłucnowa zmiana bliznowata w płucu {{strona}}, {{zwiazek_z_przebytym_zawalem_lub_niepewny}}.
  clinicalNotes:
    - "Pasmowata blizna nie ustala przyczyny; porównanie z wcześniejszym obrazowaniem może potwierdzić ewolucję."
