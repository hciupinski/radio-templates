sections:
  assessmentChecklist:
    - Rozmieszczenie, wymiary i dynamika guzków; położenie względem ogniska pierwotnego.
    - Węzły, guzki opłucnowe, płyn i zmiany kostne w zakresie badania.
    - Nie każdy dodatkowy guzek jest przerzutem; znaczenie TNM zależy od lokalizacji.
  reportTemplate: |
    {{stronnosc}} w miąższu płucnym obecne liczne lite guzki o zróżnicowanej wielkości, od {{najmniejszy_mm}} do {{najwiekszy_mm}} mm, rozmieszczone {{rozmieszczenie}}. W porównaniu z badaniem z dnia {{data_badania}} widoczna {{dynamika}} zmian. Dodatkowo {{wezly_kosci_i_guzki_oplucnowe}}. Guz pierwotny i jego zasięg {{guz_pierwotny}}, pozostałe zmiany w zakresie badania {{inne}}.
  impressionTemplate: |
    Liczne zmiany ogniskowe w płucach, {{pewnosc_rozsiewu_w_kontekscie_raka_pluca}}. {{dynamika_i_inne_zmiany}}.
  clinicalNotes:
    - Podejrzane ogniska nie są swoiste dla przerzutów; rozpoznanie należy odnieść do choroby podstawowej i badań porównawczych. CT ocenia wyłącznie struktury objęte badaniem i nie potwierdza histologii ani mikroskopowego zajęcia węzłów.
