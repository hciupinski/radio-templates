sections:
  assessmentChecklist:
    - Strona i wielkość tylno-bocznego ubytku przepony.
    - Zawartość worka i ucisk płuca.
    - Cechy niedrożności, skrętu i niedokrwienia zawartości.
  reportTemplate: |
    W tylno-bocznej części {{strona}} kopuły przepony widoczny ubytek o szerokości {{szerokosc_mm}} mm, przez który przemieszczają się {{zawartosc}}. Sąsiadujący miąższ płuca {{ucisk_i_niedodma}}. Cechy niedrożności, skrętu lub niedokrwienia {{powiklania_i_ograniczenia}}.
  impressionTemplate: |
    Przepuklina przeponowa typu Bochdaleka po stronie {{strona}}, zawierająca {{zawartosc}}. {{powiklania}}.
  clinicalNotes:
    - Ocena ukrwienia zawartości przepukliny jest ograniczona bez odpowiedniej fazy po dożylnym podaniu kontrastu; niedrożność lub podejrzenie niedokrwienia należy jednoznacznie opisać i pilnie przekazać.
