sections:
  assessmentChecklist:
    - Rodzaj i zawartość przepukliny, położenie połączenia przełykowo-żołądkowego.
    - Wymiary wrót, rotacja i rozdęcie żołądka, ucisk sąsiednich struktur.
    - Cechy niedrożności lub niedokrwienia w objętym zakresie.
