sections:
  assessmentChecklist:
    - Położenie połączenia żołądkowo-przełykowego i dna żołądka, zawartość worka.
    - Rozmiar przepukliny, typ gdy możliwy do określenia.
    - Cechy skrętu, niedrożności lub niedokrwienia.
  reportTemplate: |
    Połączenie żołądkowo-przełykowe {{polozenie}}, do klatki piersiowej przemieszczone {{zawartosc_worka}}. Worek przepuklinowy {{wymiary_mm}} mm; rozwór i odnogi przepony {{rozwor}}. Cechy skrętu, niedrożności lub niedokrwienia {{powiklania}}.
  impressionTemplate: |
    Przepuklina rozworu przełykowego {{typ_jesli_mozliwy_do_okreslenia}}. {{powiklania}}.
  clinicalNotes:
    - Samo nieprawidłowe ustawienie żołądka w dużej przepuklinie nie dowodzi ostrego skrętu; należy ocenić cechy niedrożności i możliwego niedokrwienia.
    - Ocena wzmocnienia ściany i niedokrwienia jest ograniczona bez odpowiedniej fazy pokontrastowej; brak jednoznacznych cech CT nie wyklucza niedokrwienia.
