sections:
  assessmentChecklist:
    - Lokalizacja i wielkość pakietów węzłowych, w tym wnęk i okolic nadobojczykowych.
    - Relacja masy do naczyń, w szczególności żyły głównej górnej, i dróg oddechowych.
    - Płyn opłucnowy lub osierdziowy oraz zmiany pozawęzłowe i porównanie.
  reportTemplate: |
    W {{lokalizacja_srodpiersia}} obecne {{pakiety_i_masa}} o wymiarach {{wymiary_mm}} mm, o strukturze {{struktura_i_wzmocnienie}}. Stosunek do naczyń, w tym żyły głównej górnej, i dróg oddechowych {{naczynia_i_drogi_oddechowe}}. Węzły w innych lokalizacjach {{lokalizacje_i_wymiary}}. Opłucna i osierdzie {{plyn}}; porównanie {{porownanie}}.
  impressionTemplate: |
    Limfadenopatia śródpiersia {{lokalizacja_i_zasieg}}, {{pewnosc}} choroby limfoproliferacyjnej. {{ucisk_i_zmiany_towarzyszace}}. Rozpoznanie wymaga weryfikacji histopatologicznej.
  clinicalNotes:
    - CT klatki piersiowej nie obejmuje wszystkich okolic węzłowych i nie wystarcza do pełnego określenia stadium chłoniaka. CT nie ustala typu histologicznego; ocena aktywności i odpowiedzi zależy od podtypu choroby i zastosowanej metody, w tym PET/CT.
