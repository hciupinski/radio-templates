sections:
  assessmentChecklist:
    - Rozmieszczenie i rozległość gazu w śródpiersiu oraz szyi.
    - Drogi oddechowe, przełyk i płyn śródpiersia; kontekst urazowy lub po zabiegu.
    - Odma opłucnowa, podskórna i zmiany w płucach.
  reportTemplate: |
    W śródpiersiu gaz {{lokalizacja_i_zasieg}}, w tkankach szyi i ściany klatki piersiowej {{odma_podskorna}}. Tchawica, oskrzela i przełyk {{ocena_i_ograniczenia}}. Płyn śródpiersia {{plyn}}, opłucna {{odma_i_plyn}}, płuca {{pluca}}. {{inne_zmiany}}.
  impressionTemplate: |
    Odma śródpiersia {{zasieg}}. {{mozliwe_zrodlo_i_zmiany_towarzyszace}}.
  clinicalNotes:
    - Gaz w śródpiersiu sam nie ustala miejsca przecieku ani nie wyklucza uszkodzenia przełyku lub dróg oddechowych.
