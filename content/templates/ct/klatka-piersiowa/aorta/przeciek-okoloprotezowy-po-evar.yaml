sections:
  assessmentChecklist:
    - "Dostępne fazy przedkontrastowa, tętnicza i opóźniona; ognisko kontrastu w worku poza stentgraftem."
    - "Prawdopodobne źródło przecieku, połączenia stentgraftu i możliwość określenia typu."
    - "Maksymalna średnica worka prostopadle do osi aorty, porównanie oraz drożność i położenie stentgraftu."
  reportTemplate: |
    Stan po EVAR. Dostępne fazy badania: {{fazy}}. W worku tętniaka poza światłem stentgraftu widoczne {{ognisko_kontrastu}}, uwidocznione w fazie {{faza}}; prawdopodobne źródło {{zrodlo}}. Obraz {{typ_przecieku_lub_nieokreslony}}. Maksymalny wymiar worka {{srednica_mm}} mm, prostopadle do osi aorty; poprzednio {{poprzedni_wymiar_mm}} mm. Położenie i ciągłość stentgraftu {{stentgraft}}, drożność odnóg {{odnogi}}. Inne powikłania {{inne}}.
  impressionTemplate: |
    Przeciek okołoprotezowy po EVAR {{typ_lub_nieokreslony}}. Worek tętniaka {{srednica_mm}} mm; {{porownanie}}.
  clinicalNotes:
    - "Bez fazy opóźnionej wykrycie wolnego przecieku może być ograniczone; bez fazy przedkontrastowej trudniej odróżnić kontrast od zwapnień. Typ przecieku należy określić jedynie przy wystarczającej pewności."
