sections:
  assessmentChecklist:
    - Położenie, długość i najmniejsza średnica zwężenia oraz średnice referencyjne.
    - Krążenie oboczne, warianty łuku i tętniaki.
    - Zmiany po leczeniu; gradient ciśnienia wymaga oceny hemodynamicznej.
  reportTemplate: |
    W obrębie {{lokalizacja_wzgledem_lewej_tetnicy_podobojczykowej}} widoczne odcinkowe zwężenie światła aorty do średnicy około {{srednica_mm}} mm, na długości {{dlugosc_mm}} mm. Średnica aorty przed zwężeniem wynosi {{srednica_przed_mm}} mm, za zwężeniem {{srednica_za_mm}} mm. Naczynia krążenia obocznego, w tym tętnice międzyżebrowe i piersiowe wewnętrzne {{krazenie_oboczne}}. Poszerzenie aorty, tętniak i ewentualne zmiany po leczeniu {{zmiany_towarzyszace}}.
  impressionTemplate: |
    Koarktacja aorty {{lokalizacja}}, {{krazenie_oboczne_i_zmiany_towarzyszace}}.
  clinicalNotes:
    - CTA określa anatomię zwężenia, lecz nie mierzy bezpośrednio gradientu ciśnień.
