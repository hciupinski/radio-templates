    W odcinku {{odcinek}} zmienionej miażdżycowo aorty uwidoczniono wypełnioną kontrastem niszę wnikającą w ścianę, o szerokości {{szerokosc_mm}} mm i głębokości {{glebokosc_mm}} mm. Średnica aorty {{srednica_mm}} mm. Krwiak śródścienny {{krwiak}}, cechy pęknięcia {{pekniecie}}.
