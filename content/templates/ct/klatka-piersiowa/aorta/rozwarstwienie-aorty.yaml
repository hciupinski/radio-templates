sections:
  assessmentChecklist:
    - Zakres, zajęcie aorty wstępującej i klasyfikacja Stanford, jeśli możliwa.
    - Światło prawdziwe i fałszywe, odejścia gałęzi, punkt wejścia i wymiary.
    - Płyn osierdziowy, pęknięcie, krwiak śródścienny oraz malperfuzja w zakresie badania.
  reportTemplate: |
    Zakres i jakość badania {{zakres_i_jakosc}}. W świetle aorty widoczna błona rozwarstwienia, rozdzielająca światło prawdziwe i fałszywe. Widoczny zasięg rozwarstwienia od {{zasieg_proksymalny}} do {{zasieg_dystalny}}. Miejsce pierwotnego wniknięcia krwi {{punkt_wejscia_lub_nieustalony}}. Maksymalna średnica aorty wynosi {{srednica_mm}} mm. Światło fałszywe {{droznosc_swiatla_falszywego}}. Gałęzie łuku oraz naczynia trzewne w zakresie badania {{pochodzenie_i_zajecie_galezi}}. {{pekniecie_krwiak_plyn_osierdziowy_i_malperfuzja}}.
  impressionTemplate: |
    Rozwarstwienie aorty typu {{typ_stanford_lub_nieocenialny}}, obejmujące odcinek {{zasieg}}. {{powiklania_i_ograniczenia}}.
  clinicalNotes:
    - Typ Stanford należy określić tylko przy dostatecznej ocenie aorty wstępującej. Artefakt ruchowy może naśladować płat; ocena krwiaka śródściennego jest ograniczona bez fazy przed kontrastem.
