    Rozwarstwienie aorty od {{poczatek}} do {{koniec}}, {{typ_stanford_lub_ograniczenia}}. {{powiklania}}.
  clinicalNotes:
    - "Typ Stanford należy określić tylko przy dostatecznej ocenie aorty wstępującej. Artefakt ruchowy może naśladować płat; ocena krwiaka śródściennego jest ograniczona bez fazy przed kontrastem."
