  reportTemplate: |
    Zakres i jakość badania {{zakres_i_jakosc}}. Płat rozwarstwienia od {{poczatek}} do {{koniec}}; aorta wstępująca {{ocena_aorty_wstepujacej}}, typ Stanford {{typ_lub_niemozliwy_do_okreslenia}}. Punkt wejścia {{punkt_wejscia_lub_niewidoczny}}. Światło prawdziwe {{swiatlo_prawdziwe}}, rzekome {{swiatlo_rzekome}}. Gałęzie {{galezie_i_droznosc}}, cechy malperfuzji {{malperfuzja}}. Krwawienie lub płyn {{powiklania}}.
