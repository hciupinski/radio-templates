sections:
  assessmentChecklist:
    - Żebra, mostek, łopatki, kręgosłup oraz ściana klatki.
    - Płuca, opłucna, osierdzie, oskrzela i przepona.
    - Aorta i inne naczynia w zakresie oraz fazie umożliwiającej ocenę.
  reportTemplate: |
    Po stronie {{strona}} złamania żeber {{numery_i_przemieszczenie}}; mostek, łopatki i kręgosłup {{kosci}}. Miąższ płuc {{stluczenie_i_inne}}, jamy opłucnej {{odma_i_plyn}}. W ścianie klatki {{obrzek_i_krwiak}}. Aorta piersiowa i inne naczynia {{naczynia_i_ograniczenia_fazy}}, osierdzie {{osierdzie}}, drogi oddechowe {{oskrzela}}, przepona {{przepona}}.
  impressionTemplate: |
    Pourazowe zmiany klatki piersiowej {{najwazniejsze_obrazenia}}. {{powiklania_i_ograniczenia}}.
  clinicalNotes:
    - Ocena uszkodzenia naczyń i aktywnego krwawienia zależy od fazy i jakości zakontrastowania; pojedyncza faza może nie pozwalać na określenie dynamiki ani źródła krwawienia.
    - Opis obejmuje klatkę piersiową i widoczne nadbrzusze; nie zastępuje oceny pozostałych obszarów w wielonarządowym badaniu urazowym.
