sections:
  assessmentChecklist:
    - Ściana klatki i kości, kręgosłup, krwiaki oraz wynaczynienie w dostępnych fazach.
    - Płuca, opłucna, drogi oddechowe, przepona, śródpiersie, serce i aorta.
    - Dreny, zakres i ograniczenia oraz objęte badaniem nadbrzusze.
  reportTemplate: |
    Badanie {{fazy_i_ograniczenia}}. Ściana klatki i kości {{zlamania_i_krwiaki}}. Płuca {{stluczenia_lub_rozdarcia}}, opłucna {{odma_i_plyn}}. Drogi oddechowe {{drogi_oddechowe}}, śródpiersie i aorta {{srodpiersie_i_naczynia}}, serce i osierdzie {{serce_i_osierdzie}}. Przepona {{przepona}}, widoczne nadbrzusze {{nadbrzusze}}, dreny {{dreny}}.
  impressionTemplate: |
    {{najwazniejsze_obrazenia_i_powiklania}}. {{ograniczenia}}.
  clinicalNotes:
    - Ocena uszkodzenia naczyń i aktywnego krwawienia zależy od fazy i jakości zakontrastowania; pojedyncza faza może nie pozwalać na określenie dynamiki ani źródła krwawienia.
    - Opis obejmuje klatkę piersiową i widoczne nadbrzusze; nie zastępuje oceny pozostałych obszarów w wielonarządowym badaniu urazowym.
