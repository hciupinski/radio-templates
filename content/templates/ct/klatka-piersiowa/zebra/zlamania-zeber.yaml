sections:
  assessmentChecklist:
    - Strona, numery żeber, położenie, liczba szczelin i przemieszczenie.
    - Wieloodcinkowość, ewentualny segment niestabilny i inne złamania.
    - Odma, płyn opłucnowy, stłuczenie i krwiak ściany.
