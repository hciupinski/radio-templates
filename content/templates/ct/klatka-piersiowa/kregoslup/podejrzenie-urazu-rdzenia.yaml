sections:
  assessmentChecklist:
    - Poziom, rodzaj i przemieszczenie obrażeń kostnych.
    - Odłamy lub materiał w kanale, wymiar i możliwy ucisk.
    - Stan neurologiczny i ograniczona ocena rdzenia oraz więzadeł.
  reportTemplate: |
    W objętym badaniem odcinku kręgosłupa {{poziom_i_obrazenia_kostne}}. Przemieszczenie, zwichnięcie lub retropulsja {{przemieszczenie}}; kanał kręgowy {{wymiar_i_mozliwy_ucisk}}. Ocena samego rdzenia i więzadeł w TK jest ograniczona. {{tkanki_i_inne_obrazenia}}.
  impressionTemplate: |
    {{obrazenia_kostne_i_kanal}}. CT nie wyklucza urazu rdzenia ani więzadeł; {{korelacja_neurologiczna_i_dalsza_ocena}}.
  clinicalNotes:
    - Przy objawie neurologicznym mogącym wynikać z urazu rdzenia wytyczne NICE zalecają MR po CT niezależnie od tego, czy CT wykazuje przyczynę objawu; wynik wymaga pilnej korelacji klinicznej.
