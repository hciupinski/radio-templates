sections:
  assessmentChecklist:
    - Poziom i morfologia, ubytek wysokości oraz tylna ściana trzonu.
    - Odłamy w kanale, łuki, nasady i ustawienie kręgów.
    - Tkanki przykręgowe, inne obrażenia i ograniczenia CT.
  reportTemplate: |
    Na poziomie {{poziom}} złamanie trzonu {{morfologia}}, obniżenie wysokości części przedniej {{obnizenie_przednie_procent}}%, środkowej {{obnizenie_srodkowe_procent}}%. Tylna ściana i ewentualna retropulsja {{tylna_sciana_i_retropulsja}}; kanał kręgowy {{kanal}}. Elementy tylne i ustawienie {{elementy_tylne_i_ustawienie}}. Tkanki przykręgowe i inne obrażenia {{inne}}.
  impressionTemplate: |
    Złamanie kręgu {{poziom_i_morfologia}}. {{retropulsja_kanal_i_inne_obrazenia}}.
  clinicalNotes:
    - CT klatki może wymagać dedykowanych rekonstrukcji kręgosłupa; ocena więzadeł i rdzenia jest ograniczona.
