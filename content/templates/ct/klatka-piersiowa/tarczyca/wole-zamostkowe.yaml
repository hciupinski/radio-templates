  assessmentChecklist:
    - Wielkość tarczycy, guzkowatość i zwapnienia.
    - Zasięg zamostkowy, najwęższa średnica tchawicy i jej przemieszczenie.
    - Stosunek do naczyń, przełyku i struktur śródpiersia.
