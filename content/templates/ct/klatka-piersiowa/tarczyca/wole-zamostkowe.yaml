    Tarczyca {{wielkosc_i_struktura}}, zmiany guzkowe i zwapnienia {{guzki_i_zwapnienia}}. {{plat}} schodzi zamostkowo do poziomu {{dolny_zasieg}}. Tchawica {{przemieszczenie_i_ucisk}}, minimalna średnica {{minimalna_srednica_mm}} mm. Stosunek do przełyku i naczyń {{przelyk_i_naczynia}}.
