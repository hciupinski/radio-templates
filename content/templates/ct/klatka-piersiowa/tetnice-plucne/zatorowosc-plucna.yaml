sections:
  assessmentChecklist:
    - Lokalizacja i rozległość zatorów oraz najbardziej proksymalny poziom.
    - Liczbowy stosunek RV/LV, przegroda międzykomorowa i zmiany sugerujące zawał płuca.
    - Jakość zakontrastowania, artefakty oraz cechy ostrej lub przewlekłej choroby.
  reportTemplate: |
    Jakość angio-CT i zakres oceny {{jakosc_i_zakres_oceny}}. W tętnicach płucnych {{poziom_naczyn}} po stronie {{strona}} obecne ubytki zakontrastowania, odpowiadające materiałowi zatorowemu {{charakter_ostry_lub_przewlekly}}. Najbardziej proksymalny zator zlokalizowany w {{lokalizacja_proksymalna}}. Stosunek maksymalnych wewnętrznych wymiarów prawej do lewej komory (RV/LV) wynosi {{stosunek_rv_lv_lub_nieocenialny}}. {{przegroda_miedzykomorowa}}. W obwodowych partiach płuca {{strona_pluca}} {{zageszczenie_klinowate_lub_brak}}. Opłucna {{oplucna}}.
  impressionTemplate: |
    {{pewnosc_i_charakter_zatorowosci}} tętnic płucnych {{lokalizacja_i_rozleglosc}}. {{cechy_przeciazenia_prawej_komory}}. {{podejrzenie_zawalu_pluca_lub_brak}}. {{ograniczenia}}.
  clinicalNotes:
    - Wynik ujemny ogranicz do diagnostycznie ocenionego poziomu tętnic; niedostateczne zakontrastowanie lub artefakty mogą uniemożliwić ocenę.
    - Do pomiaru RV/LV użyj maksymalnych wymiarów wewnętrznych w przekrojach osiowych albo w rekonstrukcji czterojamowej i podaj zastosowaną metodę.
    - Ocena RV/LV w CT opisuje wymiary jam, a nie bezpośredni pomiar funkcji prawej komory; cechy przewlekłe i ostre mogą współistnieć.
