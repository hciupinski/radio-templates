sections:
  assessmentChecklist:
    - Rozmieszczenie krwi w zbiornikach podstawy, bruzdach i szczelinach.
    - Krew w komorach lub miąższu, wodogłowie i efekt masy.
    - Ograniczenia badania bez angiografii w ocenie przyczyny.
