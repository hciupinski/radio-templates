    Hiperdensyjna krew w przestrzeni podpajęczynówkowej {{lokalizacja_i_zasieg}}. {{obecnosc_lub_brak}} krwi w komorach oraz ogniska śródmiąższowego. Układ komorowy {{opis}}, zbiorniki podstawy {{opis}}, przemieszczenie struktur pośrodkowych {{mm}} mm.
  impressionTemplate: |
    Krwotok podpajęczynówkowy {{lokalizacja_i_zasieg}}. {{krew_komorowa_i_wodoglowie}}.
  clinicalNotes:
    - Badanie bez angiografii nie ustala ani nie wyklucza naczyniowego źródła krwawienia.
