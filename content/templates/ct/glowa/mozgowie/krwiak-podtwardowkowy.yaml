sections:
  assessmentChecklist:
    - Strona, zasięg, maksymalna grubość i gęstość zbiornika.
    - Efekt masy, przemieszczenie linii pośrodkowej, zbiorniki podstawy i komory.
    - Współistniejące krwawienia i złamania w dostępnym zakresie.
