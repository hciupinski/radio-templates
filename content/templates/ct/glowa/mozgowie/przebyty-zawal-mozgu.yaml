  clinicalNotes:
    - "Naczyniowe pochodzenie ubytku należy ocenić w kontekście topografii i wywiadu; encefalomalacja może mieć także inne przyczyny. Czas powstania ogniska może być niepewny bez wcześniejszego badania; CT ma ograniczoną czułość dla wczesnego współistniejącego niedokrwienia."
