  reportTemplate: |
    W {{lokalizacja_i_strona}} obszar encefalomalacji o wymiarach {{wymiary_mm}} mm, z {{glejoza}} oraz {{poszerzenie_przestrzeni}}. Porównanie {{porownanie}}. Inne zmiany {{inne_zmiany}}.
