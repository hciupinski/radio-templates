    Uraz tkanek miękkich {{lokalizacja}} ze złamaniami {{zlamania}}. Ciała obce {{polozenie}} z artefaktami {{artefakty}}. Uszkodzenie miąższu {{uszkodzenie}}, krwawienia {{krwawienia}}, powietrze śródczaszkowe {{powietrze}}. Obrzęk i efekt masy {{efekt_masy}}, przemieszczenie linii pośrodkowej {{przemieszczenie_mm}} mm; komory i zbiorniki {{komory}}.
