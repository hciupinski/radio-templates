sections:
  assessmentChecklist:
    - Położenie, wymiary i maksymalna grubość zbiornika.
    - Przylegające złamanie, inne ogniska krwawienia i stłuczenia.
    - Efekt masy, przemieszczenie linii pośrodkowej oraz stan komór i zbiorników.
