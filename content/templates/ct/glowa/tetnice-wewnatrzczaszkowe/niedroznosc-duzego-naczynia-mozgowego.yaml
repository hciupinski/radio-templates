sections:
  assessmentChecklist:
    - "Lokalizacja i długość niedrożności, drożność dalsza oraz krążenie oboczne w dostępnym zakresie."
    - "Ocena pozostałych naczyń i jakości wypełnienia."
  reportTemplate: |
    Brak zakontrastowania {{tetnica_i_odcinek}} od poziomu {{poczatek}}; zasięg braku wypełnienia {{zasieg_i_pewnosc}}. Dystalne wypełnienie {{wypelnienie_dystalne}}, krążenie oboczne {{krazenie_oboczne}}. Inne tętnice {{pozostale}}, ograniczenia {{ograniczenia}}.
  impressionTemplate: |
    {{pewnosc_niedroznosci}} {{tetnica_i_odcinek}}; wypełnienie dystalne {{wypelnienie_dystalne}}.
  clinicalNotes:
    - "W jednofazowym CTA wolny przepływ może powodować pozorny brak wypełnienia i zawyżać długość niedrożności; zakres należy określić tylko przy dostatecznej jakości badania."
