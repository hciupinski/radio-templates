    Złamanie kości skroniowej {{strona}}, przebieg {{przebieg}}. Torebka błędnika {{torebka}}, kanał nerwu twarzowego {{kanal_nerwu}}, kanał tętnicy szyjnej {{kanal_tetnicy}}. Jama bębenkowa i kosteczki {{ucho_srodkowe}}, komórki sutkowe {{komorki}}, przewód słuchowy {{przewod}}. Zmiany śródczaszkowe w zakresie badania {{zmiany_srodczaszkowe}}.
