sections:
  assessmentChecklist:
    - "Przebieg złamania i zajęcie torebki błędnika, kanału nerwu twarzowego i kanału tętnicy szyjnej."
    - "Ucho środkowe, kosteczki, przewód słuchowy, staw skroniowo-żuchwowy i powikłania śródczaszkowe."
