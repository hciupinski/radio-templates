sections:
  assessmentChecklist:
    - Wielkość macicy, liczba zmian i położenie największych względem jamy i surowicówki.
    - Połączenie z macicą w przypadku guzka uszypułowanego, zwapnienia lub zwyrodnienie.
    - Efekt masy na pęcherz, jelita i moczowody.
  reportTemplate: >
    Macica {{wymiary_macicy_mm}} mm, o {{zarys}} zarysie. Widoczne {{liczba_i_lokalizacja}} zmiany związane z mięśniem macicy,
    największa {{wymiar_mm}} mm. Zwapnienia i cechy zwyrodnienia {{zmiany_wewnetrzne}}. Stosunek do jamy macicy i struktur
    sąsiednich {{relacje_i_efekt_masy}}.
  impressionTemplate: |
    Obraz przemawiający za macicą mięśniakowatą. {{istotne_powiklania_lub_ograniczenia}}.
  clinicalNotes:
    - >-
      Sam obraz CT nie rozstrzyga charakteru nietypowej masy macicy. Przy niejasnym punkcie wyjścia lub niejednorodnym guzie
      przydatne jest ukierunkowane USG lub MR.
