sections:
  assessmentChecklist:
    - Czy ognisko wynaczynienia narasta lub zmienia kształt w kolejnej fazie i czy można ustalić tętnicę źródłową.
    - Strona, przedział anatomiczny, największy wymiar i zasięg krwiaka.
    - Tętniak rzekomy oraz współistniejący uraz kości i narządów w zakresie badania.
  reportTemplate: >
    W fazie tętniczej w obrębie {{lokalizacja}} widoczne ognisko pozanaczyniowego kontrastu, które w fazie {{faza_pozniejsza}}
    {{zmiana_w_czasie}}. Źródło {{naczynie_strona_i_pewnosc}}. Krwiak {{przedzial_i_wymiary_mm}}. Uszkodzenia towarzyszące
    {{obrazenia}}, dodatkowe ogniska krwawienia {{inne_ogniska}}.
  impressionTemplate: |
    Czynne krwawienie w {{lokalizacja}}. {{naczynie_zrodlowe_i_pewnosc}}. {{zasieg_i_powiklania}}.
  clinicalNotes:
    - >-
      Napisz wprost, jeżeli źródło nie jest pewne. Ograniczenia protokołu, w tym brak właściwej fazy tętniczej, mogą uniemożliwić
      przypisanie pochodzenia krwawienia.
