sections:
  assessmentChecklist:
    - Fazy i jakość zakontrastowania układu wrotnego.
    - Zakres skrzepliny, stopień zamknięcia, gałęzie, żyła krezkowa górna i śledzionowa.
    - Wzmocnienie materiału, ciągłość z guzem, krążenie oboczne i cechy niedokrwienia jelit.
  reportTemplate: |
    W fazie {{faza_badania}} w {{odcinki_zyly_wrotnej}} ubytek wypełnienia {{zasieg_i_stopien_zamkniecia}}. Żyła krezkowa górna i śledzionowa {{zyly_krezkowa_i_sledzionowa}}. Materiał wewnątrznaczyniowy {{wzmocnienie_materialu_i_ograniczenia}}, ciągłość ze zmianą ogniskową {{ciaglosc_z_guzem}}. Naczynia oboczne {{krazenie_oboczne}}. Jelita i krezka {{jelita_i_krezka}}; inne zmiany {{inne}}.
  impressionTemplate: |
    Materiał wewnątrznaczyniowy w układzie wrotnym {{zasieg_i_stopien}}: {{zakrzep_lagodny_lub_podejrzenie_tkanki_nowotworowej_lub_nieokreslony}}. {{powiklania}}.
  clinicalNotes:
    - Jednoznaczne wzmocnienie tkanki w świetle żyły przemawia za jej charakterem nowotworowym. Ciągłość z guzem jest dodatkową wskazówką, lecz nie jest konieczna; przy ograniczonym protokole charakter może pozostać nieokreślony.
