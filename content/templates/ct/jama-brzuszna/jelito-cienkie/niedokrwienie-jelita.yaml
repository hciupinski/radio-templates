    {{pewnosc}} niedokrwienia {{odcinek}}. {{powiklania_i_ograniczenia}}.
  clinicalNotes:
    - Badanie bez kontrastu lub wyłącznie w jednej fazie może ograniczać ocenę naczyń i wzmocnienia ściany jelita.
