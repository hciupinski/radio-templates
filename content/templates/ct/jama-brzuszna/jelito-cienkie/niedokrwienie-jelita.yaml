sections:
  assessmentChecklist:
    - Fazy badania, jakość zakontrastowania tętnic i żył krezkowych oraz ograniczenia.
    - Zasięg i wzmocnienie ściany jelita z uwzględnieniem fazy.
    - Drożność naczyń w zakresie możliwej oceny oraz krezka.
    - Płyn, pneumatoza, gaz w układzie wrotnym i perforacja.
