sections:
  assessmentChecklist:
    - Wielkość i ściana pęcherzyka oraz widoczne złogi, w tym w szyi lub przewodzie pęcherzykowym.
    - Tkanka i płyn okołopęcherzykowy; drogi żółciowe i sąsiednia wątroba.
    - "Cechy powikłań: ubytek lub brak wzmocnienia ściany, gaz, ropień i perforacja."
  reportTemplate: |
    Pęcherzyk żółciowy {{wielkosc}}, ściana {{grubosc_i_wzmocnienie}}. Złogi {{zlogi_i_lokalizacja}}. Tkanki okołopęcherzykowe {{naciek_i_plyn}}, miąższ wątroby w sąsiedztwie {{watroba}}. Drogi żółciowe {{drogi_zolciowe}}. Cechy powikłań {{gaz_ubytek_sciany_ropien}}.
  impressionTemplate: |
    Obraz {{pewnosc}} ostrego zapalenia pęcherzyka żółciowego. {{powiklania}}.
  clinicalNotes:
    - Pogrubienie ściany pęcherzyka jest nieswoiste; interpretacja wymaga korelacji klinicznej. CT może nie uwidocznić złogów.
