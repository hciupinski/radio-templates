sections:
  assessmentChecklist:
    - Lokalizacja i dynamika ogniska wynaczynienia między fazami.
    - Związek z uszkodzeniem miąższu i ewentualne naczynie źródłowe.
    - Czy wynaczynienie pozostaje przy śledzionie, czy wychodzi poza jej torebkę.
  reportTemplate: >
    W obrębie {{lokalizacja}} śledziony widoczne ognisko pozanaczyniowego kontrastu {{faza_i_wymiary}}. W kolejnej fazie
    {{dynamika}}. Źródło {{naczynie_lub_nieustalone}}. Uszkodzenie miąższu {{opis_uszkodzenia}}, krwiak i relacja wycieku do
    torebki {{zasieg_i_wymiary}}. Krew w jamie otrzewnej {{rozmieszczenie}}.
  impressionTemplate: |
    {{pewnosc_czynnego_krwawienia}} ze śledziony, {{lokalizacja_i_zasieg}}. {{wspolistniejace_uszkodzenia_i_ograniczenia}}.
  clinicalNotes:
    - Ognisko kontrastu o ograniczonym kształcie może odpowiadać tętniakowi rzekomemu; dostępne fazy i ich jakość wpływają na pewność oceny aktywnego wynaczynienia.
