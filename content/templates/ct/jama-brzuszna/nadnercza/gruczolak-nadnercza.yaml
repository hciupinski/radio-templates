sections:
  assessmentChecklist:
    - Strona, maksymalny wymiar, granice i jednorodność.
    - Pomiar gęstości w wiarygodnej fazie bez kontrastu z pominięciem efektu objętości częściowej.
    - Porównanie z poprzednimi badaniami i kontekst kliniczny.
  reportTemplate: >
    W nadnerczu {{strona}} dobrze odgraniczony, jednorodny guzek o wymiarach {{wymiary_mm}} mm. W fazie bez kontrastu średnia
    gęstość reprezentatywnego obszaru wynosi {{gestosc_hu}} HU. Porównanie z badaniem {{data_porownania}}: {{dynamika}}. Nadnercze
    przeciwne {{opis_nadnercza_przeciwnego}}.
  impressionTemplate: |
    Jednorodny guzek nadnercza {{strona}} o cechach gruczolaka bogatego w lipidy.
  clinicalNotes:
    - >-
      Właściwy dla wniosku jest jednorodny guzek o gęstości do 10 HU w rzeczywistej fazie bez kontrastu. Przy braku fazy lub
      nietypowych cech scharakteryzuj zmianę jako niejednoznaczną i uwzględnij wywiad onkologiczny. CT nie określa czynności
      hormonalnej.
