    {{opis_drugiego_nadnercza}}. Pozostałe zmiany podejrzane {{inne_ogniska}}.
  impressionTemplate: |
    Zmiana nadnercza {{strona}} {{ocena_prawdopodobienstwa_przerzutu}} w kontekście {{kontekst_onkologiczny}}. {{ograniczenia}}.
  clinicalNotes:
    - >-
      Sama obecność guzka u chorego onkologicznego nie ustala jego etiologii. Jeżeli wcześniejsze cechy są diagnostyczne dla
      łagodnego gruczolaka, uwzględnij je przy ocenie.
