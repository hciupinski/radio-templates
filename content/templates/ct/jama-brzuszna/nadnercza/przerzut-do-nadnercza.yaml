sections:
  assessmentChecklist:
    - Porównanie zmian w czasie i odniesienie do rozpoznania onkologicznego.
    - Strona, jedno- lub obustronność, wymiary, jednorodność i dostępne fazy.
    - Cechy łagodnej zmiany, naciekanie i inne zmiany w zakresie badania.
