    Z miąższu nerki {{strona}}, w obrębie {{lokalizacja}}, wychodzi zmiana o wymiarach {{wymiary_mm}} mm. Tłuszcz makroskopowy
    {{lokalizacja_i_gestosc_hu}}, komponent tkanek miękkich {{opis_skladowej}}, zwapnienia {{zwapnienia}}. Naczynia śródguzowe
    {{naczynia_i_tetniaki}}. Przestrzeń okołonerkowa {{krwiak_lub_brak_lub_ograniczenia}}.
