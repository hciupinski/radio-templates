sections:
  assessmentChecklist:
    - Punkt wyjścia z miąższu nerki, położenie i wymiary.
    - Tłuszcz makroskopowy w zmianie, części tkanek miękkich i zwapnienia.
    - Naczynia śródguzowe, tętniaki i krwawienie w zakresie dostępnym w protokole.
