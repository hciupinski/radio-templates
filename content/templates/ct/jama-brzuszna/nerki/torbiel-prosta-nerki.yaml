sections:
  assessmentChecklist:
    - Strona, położenie, liczba i maksymalny wymiar zmian.
    - Jednorodność płynu, grubość i gładkość ściany oraz brak przegród, guzków i zwapnień.
    - Jakość pomiaru i fazy wykorzystane do charakterystyki.
  reportTemplate: >
    W nerce {{strona}}, w obrębie {{lokalizacja}}, jednorodna zmiana płynowa o wymiarze {{wymiar_mm}} mm i gęstości {{gestosc_hu}}
    HU. Ściana cienka, gładka. Przegród, guzków ściennych ani zwapnień nie uwidoczniono. Ocena wzmocnienia zawartości
    {{wynik_oceny_i_fazy}}. Pozostałe zmiany {{inne_torbiele_lub_brak}}.
  impressionTemplate: |
    Torbiel prosta nerki {{strona}} (Bosniak I w adekwatnym badaniu).
  clinicalNotes:
    - >-
      Użyj wniosku przy spełnieniu kryteriów prostej torbieli. Cienka, gładka ściana torbieli Bosniak I może się wzmacniać. W
      przypadku niejednorodności lub oceny ograniczonej użyj opisu zmiany torbielowatej bez wymuszania kategorii.
