sections:
  assessmentChecklist:
    - "Strona, wielkość nerki oraz rozmieszczenie klinowatych lub pasmowatych obszarów słabszego wzmocnienia."
    - "Zbiorniki ropne, gaz, naciek okołonerkowy i szerzenie pozanerkowe."
    - "Zastój, ewentualny złóg i stan drugiej nerki."
  reportTemplate: |
    Badanie po dożylnym podaniu środka kontrastowego, faza {{faza}}. Nerka {{strona}} {{wielkosc}}; obszary słabszego wzmocnienia {{rozmieszczenie_i_charakter}}. Tkanka okołonerkowa {{naciek}}, {{ropien_lub_brak}} zbiornika ropnego i {{gaz_lub_brak}} gazu. Układ kielichowo-miedniczkowy {{zastoj}}, moczowód {{moczowod}}, złogi {{zlogi}}. Nerka przeciwna {{opis_nerki_przeciwnej}}.
  impressionTemplate: |
    Obraz przemawiający za ostrym odmiedniczkowym zapaleniem nerki {{strona}}. {{zastoj_i_powiklania}}.
  clinicalNotes:
    - "Obraz CT należy interpretować wraz z objawami i wynikami badań laboratoryjnych; ogniska słabszego wzmocnienia nie są swoiste dla zakażenia. Ocena miąższu bez kontrastu jest ograniczona."
