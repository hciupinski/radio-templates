sections:
  assessmentChecklist:
    - "Ocenić, czy klasyfikacja ma zastosowanie i czy dostępny protokół umożliwia ocenę wzmocnienia."
    - "Lokalizacja, wymiary, zawartość i zwapnienia; ściana i przegrody: liczba, maksymalna grubość, gładkość i wzmocnienie."
    - "Wzmacniające się guzki, ich wielkość i granice; kategoria tylko przy wystarczającej jakości."
  reportTemplate: |
    W nerce {{strona}}, {{lokalizacja}}, torbielowata zmiana o wymiarach {{wymiary_mm}} mm. Dostępne fazy {{fazy}}, zawartość {{gestosc_i_jednorodnosc}}, zwapnienia {{zwapnienia}}. Ściana {{grubosc_i_wzmocnienie}}, przegrody {{liczba_grubosc_wzmocnienie}}, nierówności lub guzki {{guzki_i_wzmocnienie}}. Ocena wzmocnienia {{metoda_i_ograniczenia}}. {{kategoria_bosniak_2019_lub_nieokreslona}}.
  impressionTemplate: |
    Torbielowata zmiana nerki {{strona}} {{wymiary_mm}} mm, {{kategoria_bosniak_2019_lub_nieokreslona}}.
  clinicalNotes:
    - "Bosniak 2019 dotyczy właściwie scharakteryzowanych zmian torbielowatych, po wykluczeniu etiologii zakaźnej, zapalnej i naczyniowej; wzmocniona tkanka stanowi mniej niż 25% zmiany."
    - "Kategoria IIF lub wyższa w CT wymaga wzmocnienia ściany, przegród lub guzka; ocena jest ograniczona bez porównywalnej fazy przedkontrastowej i pokontrastowej oraz przy maskujących zwapnieniach. W niejednoznacznych przypadkach nie należy wymuszać kategorii."
